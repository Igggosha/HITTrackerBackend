services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nestdb}
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql.utf16:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private

  replication-init:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nestdb}
      PGPASSWORD: ${DB_PASSWORD:-password}
      PGDATA: /var/lib/postgresql/data
      # Dedicated replication credential; never the superuser password. Rotate
      # it here and in `postgres-replica` together.
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-change_me}
      # Must match the `private` network's `ipam.config.subnet` below; changing
      # either requires `docker compose down` (recreates the network, keeps volumes).
      PRIVATE_NETWORK_SUBNET: ${PRIVATE_NETWORK_SUBNET:-172.28.40.0/24}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/enable-replication.sh:/enable-replication.sh:ro
    command: ["sh", "/enable-replication.sh"]
    restart: "no"
    networks:
      - private

  postgres-replica:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      replication-init:
        condition: service_completed_successfully
    environment:
      PGDATA: /var/lib/postgresql/data
      # The replicator role's own password, never the superuser password.
      # pg_basebackup authenticates with it, and start-replica.sh also uses it
      # to refresh an already-stored primary_conninfo after a rotation.
      PGPASSWORD: ${REPLICATION_PASSWORD:-change_me}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:-change_me}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/start-replica.sh:/start-replica.sh:ro
    entrypoint: ["sh", "/start-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nestdb} && test \"$(psql -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nestdb} -tAc 'SELECT pg_is_in_recovery()')\" = t"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private

  migrate:
    build:
      context: .
      target: migration
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-nestdb}
    command: ["sh", "-c", "npm run db:baseline && npm run db:migrate"]
    restart: "no"
    networks:
      - private

  bootstrap:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      PGPASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nestdb}
    volumes:
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/00-init-db.sh:ro
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql.utf16:ro
    command: ["/bin/sh", "/docker-entrypoint-initdb.d/00-init-db.sh"]
    restart: "no"
    networks:
      - private

  # Object storage for user-uploaded media (avatars, exercise images).
  # MinIO has no host ports. The API reaches it on `private`; cloudflared can
  # publish only the S3 API through its dedicated `storage-edge` network.
  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_RELEASE: ${MINIO_IMAGE_TAG:-RELEASE.2025-10-15T17-29-55Z}
        MINIO_COMMIT: ${MINIO_SOURCE_COMMIT:-9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a}
    image: hit-tracker-minio:${MINIO_IMAGE_TAG:-RELEASE.2025-10-15T17-29-55Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MinIO handles abandoned multipart uploads with a server-side sweep,
      # not the S3 AbortIncompleteMultipartUpload lifecycle action.
      MINIO_API_STALE_UPLOADS_EXPIRY: ${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: ${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-6h}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - private
      - storage-edge

  # Creates the bucket and a bucket-scoped service account for the API.
  # The bucket stays private: objects are read through short-lived presigned URLs.
  minio-init:
    image: quay.io/minio/mc:${MINIO_MC_IMAGE_TAG:-RELEASE.2025-08-13T08-35-41Z}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-hit-tracker}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_UPLOAD_PREFIX: ${S3_UPLOAD_PREFIX:-uploads}
      S3_TEMP_PREFIX: ${S3_TEMP_PREFIX:-tmp}
      S3_TEMP_EXPIRY_DAYS: ${S3_TEMP_EXPIRY_DAYS:-1}
    entrypoint: ["/bin/sh", "/docker-entrypoint-init.d/minio-init.sh"]
    volumes:
      - ./docker/minio-init.sh:/docker-entrypoint-init.d/minio-init.sh:ro
    restart: "no"
    networks:
      - private

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      # A tunnel/proxy joins the edge network later; never expose the API to the LAN.
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-nestdb}
      DATABASE_REPLICA_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres-replica:5432/${DB_NAME:-nestdb}
      # Inside Compose the API reaches MinIO by service name; presigned URLs
      # handed to clients are signed for S3_PUBLIC_ENDPOINT from .env instead.
      S3_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - private
      - edge

  frontend:
    profiles: ["edge"]
    build:
      context: ../hit-tracker-mobile
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?Set public HTTPS API URL for the web build}
        EXPO_PUBLIC_WEB_URL: ${EXPO_PUBLIC_WEB_URL:?Set public HTTPS web URL for the web build}
    restart: unless-stopped
    networks:
      - edge

  # Background outbound-only connector. It is opt-in and has no access to the
  # internal PostgreSQL network. Its storage network can only reach MinIO.
  cloudflared:
    profiles: ["edge"]
    image: cloudflare/cloudflared:latest
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    networks:
      - edge
      - storage-edge

  seed:
    image: postgres:17
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - ./seed.sql:/seed.sql:ro
    command: ["sh", "-c", "psql -h postgres -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nestdb} -f /seed.sql"]
    restart: "no"
    networks:
      - private

  studio:
    build:
      context: .
      target: migration
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-nestdb}
    command: ["npm", "run", "db:studio", "--", "--host", "0.0.0.0", "--port", "4983"]
    ports:
      - "127.0.0.1:4983:4983"
    networks:
      - private

  metrics-token:
    image: alpine:3.22.1
    profiles: [observability]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-change_me}
    command: ["sh", "-c", "umask 077; printf '%s' \"$$METRICS_TOKEN\" > /token/metrics-token; chmod 0444 /token/metrics-token"]
    volumes:
      - metrics_token:/token
    restart: "no"
    # Only writes to the `metrics_token` volume; it never talks to another
    # container or the network.
    network_mode: none

  # Idempotently creates/updates a least-privilege `metrics_reader` role for
  # postgres-exporter, instead of handing the exporter the superuser
  # credentials the API itself uses. Runs every startup of the
  # `observability` profile (not gated behind docker-entrypoint-initdb.d, so
  # it also fixes up a volume that already existed before this role did) and
  # keeps the role's password synced with METRICS_DB_PASSWORD.
  metrics-role-init:
    image: postgres:17
    profiles: [observability]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-nestdb}
      METRICS_DB_PASSWORD: ${METRICS_DB_PASSWORD:-change_me}
    volumes:
      - ./docker/observability/metrics-role-init.sh:/docker-entrypoint-init.d/metrics-role-init.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-init.d/metrics-role-init.sh"]
    restart: "no"
    networks:
      - private

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    depends_on:
      metrics-token:
        condition: service_completed_successfully
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - metrics_token:/run/metrics:ro
      - prometheus_data:/prometheus
    networks:
      - private
      - observability
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [observability]
    environment:
      # metrics_reader only holds pg_monitor (read-only), never the
      # application superuser credentials postgres/DB_PASSWORD.
      DATA_SOURCE_NAME: postgresql://metrics_reader:${METRICS_DB_PASSWORD:-change_me}@postgres:5432/${DB_NAME:-nestdb}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      metrics-role-init:
        condition: service_completed_successfully
    networks:
      - private
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - observability
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_replica_data:
  minio_data:
  prometheus_data:
  grafana_data:
  metrics_token:

networks:
  # Database services cannot be reached from the host or an Internet-facing tunnel.
  # The subnet is pinned (rather than Docker-assigned) so the replication pg_hba
  # rule can scope to it instead of 0.0.0.0/0. Override with PRIVATE_NETWORK_SUBNET;
  # a change requires `docker compose down` to recreate the network (volumes are kept).
  private:
    internal: true
    ipam:
      config:
        - subnet: ${PRIVATE_NETWORK_SUBNET:-172.28.40.0/24}
  # Reserved for the API and a future HTTPS tunnel/reverse proxy.
  edge:
    driver: bridge
  # Dedicated path from cloudflared to MinIO; PostgreSQL is not on this network.
  storage-edge:
    driver: bridge
  # Local-only observability UI/API; not shared with the tunnel network.
  observability:
    driver: bridge
