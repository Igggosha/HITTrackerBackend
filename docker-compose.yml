services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    container_name: hitttracker-postgres
    environment:
      POSTGRES_DB: hitttracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
