# Load-test overlay for docker-compose.yml (see docs/diploma/load-testing.md).
# Always used together with the base file, its own project name and env file:
#
#   docker compose -p loadtest --env-file load-tests/.env.loadtest \
#     -f docker-compose.yml -f load-tests/compose.loadtest.yml \
#     --profile events --profile observability --profile loadtest ...
#
# Paths are relative to the project directory (the repository root, i.e. the
# directory of the first -f file).
services:
  api:
    # Never the developer's `.env`: a throwaway file from load-tests/make-env.sh.
    # `!override` replaces the list (a plain list would be concatenated).
    env_file: !override [load-tests/.env.loadtest]
    # Own image tags, so building here never retags the images another
    # Compose project on this machine runs.
    image: loadtest-hit-tracker-api:local
  relay:
    image: loadtest-hit-tracker-api:local
  analytics:
    image: loadtest-hit-tracker-analytics:local
  migrate:
    image: loadtest-hit-tracker-migration:local

  # scripts/backfill-analytics-events.ts with the migration image (it has
  # tsx, pg and scripts/, but not packages/, which the script imports).
  backfill:
    profiles: [loadtest]
    image: loadtest-hit-tracker-migration:local
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-nestdb}
    volumes:
      - ./packages:/app/packages:ro
      - ./scripts:/app/scripts:ro
    command: ["npx", "tsx", "scripts/backfill-analytics-events.ts"]
    restart: "no"
    networks: [private]

  # psql client for seeding and for pg_stat_database snapshots of the primary
  # (postgres) and the standby (postgres-replica).
  psql:
    profiles: [loadtest]
    image: postgres:17
    environment:
      PGUSER: ${DB_USERNAME:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-password}
      PGDATABASE: ${DB_NAME:-nestdb}
    volumes:
      - ./load-tests:/work:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1"]
    restart: "no"
    networks: [private]

  # k6 on the internal `private` network: it reaches http://api:3000 directly,
  # no host port involved. Results are written to load-tests/results/.
  k6:
    profiles: [loadtest]
    image: grafana/k6:1.3.0
    environment:
      BASE_URL: http://api:3000
      K6_NO_USAGE_REPORT: "true"
    volumes:
      - ./load-tests:/work
    working_dir: /work
    restart: "no"
    networks: [private]
