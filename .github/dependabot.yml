# EN: Schedules weekly dependency-update proposals for the root backend and the analytics service.
# UK: Планує щотижневі пропозиції оновлення залежностей для основного бекенду та сервісу аналітики.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
