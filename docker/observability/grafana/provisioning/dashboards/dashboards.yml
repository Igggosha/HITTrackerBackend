# EN: Tells Grafana to load version-controlled dashboard definitions into the Observability folder.
# UK: Наказує Grafana завантажувати версіоновані описи панелей до папки Observability.

apiVersion: 1
providers:
  - name: observability
    orgId: 1
    folder: Observability
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
