apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    # Loki has no host port at all; Grafana reaches it over the internal
    # `observability` Compose network. See "Debugging Loki directly" in
    # docs/diploma/observability.md for how to query it from the host anyway.
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      # Clicking a requestId in a logs panel opens Explore pre-filled with a
      # Loki query for every line (any service) carrying that same
      # requestId in structured metadata — see docs/diploma/observability.md
      # ("Logs (Loki)") for the demo script.
      #
      # `$$` (not `$`) before `{__value.raw}`/`{__trace.traceId}` below is
      # required: Grafana's provisioning loader expands `${VAR}`/`$VAR` as
      # OS environment variables while reading THIS file, before jsonData is
      # even stored — an un-escaped `${__value.raw}` silently becomes an
      # empty string (no such env var), breaking the link with no error
      # anywhere. `$$` escapes to a literal `$`, so the stored jsonData (and
      # what Grafana's own template engine later expands at click time) is
      # the intended `${__value.raw}`. Verify with `GET
      # /api/datasources/uid/loki` — the `url` must show `${__value.raw}`,
      # never `""`.
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          datasourceUid: loki
          url: '{service=~".+"} | requestId="$${__value.raw}"'
          urlDisplayLabel: Show all logs for this request
        # Jumps from a log line's traceId to the matching trace in Jaeger.
        # datasourceUid points at a trace datasource (jaeger, uid `jaeger`
        # below), so Grafana treats `url` as the trace ID to open rather than
        # a literal link — see "Logs (Loki)" in docs/diploma/observability.md.
        # Only matches when tracing is enabled (traceId is only non-null when
        # a span was active; see `mixin` in src/app.module.ts).
        - name: traceId
          matcherRegex: '"traceId":"([a-f0-9]{32})"'
          datasourceUid: jaeger
          url: '$${__value.raw}'
          urlDisplayLabel: View trace in Jaeger
