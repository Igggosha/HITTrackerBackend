apiVersion: 1
datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    # Loki has no host port at all; Grafana reaches it over the internal
    # `observability` Compose network. See "Debugging Loki directly" in
    # docs/diploma/observability.md for how to query it from the host anyway.
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      # Clicking a requestId in a logs panel opens Explore pre-filled with a
      # Loki query for every line (any service) carrying that same
      # requestId in structured metadata — see docs/diploma/observability.md
      # ("Logs (Loki)") for the demo script.
      derivedFields:
        - name: requestId
          matcherRegex: '"requestId":"([^"]+)"'
          datasourceUid: loki
          url: '{service=~".+"} | requestId="${__value.raw}"'
          urlDisplayLabel: Show all logs for this request
