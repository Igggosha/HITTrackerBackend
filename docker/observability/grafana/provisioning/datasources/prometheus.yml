# EN: Provisions Prometheus as Grafana's default metrics datasource on the internal observability network.
# UK: Підключає Prometheus як стандартне джерело метрик Grafana у внутрішній мережі спостережуваності.

apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
