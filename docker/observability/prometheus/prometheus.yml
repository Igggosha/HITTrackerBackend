global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/metrics/metrics-token
    static_configs:
      - targets: [api:3000]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  # Add a separate job here when postgres-replica is introduced.
  # Standalone Kafka relay (docker-compose `events` profile). This target
  # only resolves when both `events` and `observability` profiles are
  # running together; otherwise Prometheus simply marks it down, which is
  # fine for a profile pair that is opt-in by design.
  - job_name: relay
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/metrics/metrics-token
    static_configs:
      - targets: [relay:9464]
  # Analytics read-side service (docker-compose `events` profile, same
  # METRICS_TOKEN bearer check). Like `relay`, it only resolves when the
  # `events` and `observability` profiles run together.
  - job_name: analytics
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/metrics/metrics-token
    static_configs:
      - targets: [analytics:3000]
