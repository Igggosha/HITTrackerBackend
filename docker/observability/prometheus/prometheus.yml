global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/metrics/metrics-token
    static_configs:
      - targets: [api:3000]
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]
  # Add a separate job here when postgres-replica is introduced.
