limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

server {
  listen 8080;
  server_name _;
  server_tokens off;

  client_max_body_size 11m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  limit_conn api_connections 20;
  limit_req zone=api_per_ip burst=40 nodelay;

  location / {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_request_buffering on;

    # Never trust a client-supplied forwarding chain. The Nest application
    # trusts exactly this one proxy hop when resolving request.ip.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
