limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=api_connections:10m;

# Cloudflare Tunnel supplies the original scheme. Accept only the two valid
# values and fall back to the direct connection scheme for malformed input.
map $http_x_forwarded_proto $upstream_proto {
  default $scheme;
  http http;
  https https;
}

server {
  listen 8080;
  # Compatibility listener for the existing remotely managed Cloudflare
  # ingress. Both ports terminate at this same hardened gateway.
  listen 3000;
  server_name _;
  server_tokens off;

  client_max_body_size 11m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  send_timeout 30s;

  limit_conn api_connections 20;
  limit_req zone=api_per_ip burst=40 nodelay;

  # Resolve the private API through Docker DNS at request time. A static
  # upstream address becomes stale whenever Compose recreates the API
  # container while keeping this gateway container alive.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api-internal:3000;

  location / {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_request_buffering on;

    # Never trust a client-supplied forwarding chain. The Nest application
    # trusts exactly this one proxy hop when resolving request.ip.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $upstream_proto;
    proxy_set_header Connection "";
  }
}
